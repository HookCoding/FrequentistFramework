[project]
name = "frequentist-framework"
version = "0.1.0"
description = "Quality checks and lightweight test harness for the FrequentistFramework repository"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: slow tests that execute authoritative analysis workflows",
    "requires_root: tests requiring the configured ROOT/RooFit analysis environment",
    "requires_analysis_dependencies: tests requiring prepared external analysis checkouts",
]

[tool.ruff]
line-length = 100
extend-exclude = ["atlasstyle-00-04-02"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = ['\.pyi?$', '\.ipynb$']
