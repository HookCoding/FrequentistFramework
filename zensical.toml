# Zensical configuration for the FrequentistFramework documentation.
#
# Build:   zensical build      (output in site/)
# Preview: zensical serve      (http://localhost:8000)
#
# Read more: https://zensical.org/docs/

[project]
site_name = "FrequentistFramework"
site_description = "Statistical framework for the Run 3 dijet+ISR Trigger-Level Analysis: workspace building, background fits, BumpHunter, fit-strategy validation and limit setting."
site_author = "TLA ATLAS Run 3"
copyright = """
Copyright &copy; ATLAS Collaboration
"""

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Setup" = "setup.md" },
  { "Running a fit" = "running.md" },
  { "Statistical procedure" = [
    { "Overview" = "statistics/index.md" },
    { "Validation tests" = "statistics/validation-tests.md" },
    { "Unblinding flowcharts" = "statistics/flowcharts.md" },
  ] },
  { "Running the flowchart" = [
    { "Overview" = "flowchart-steps/index.md" },
    { "1. Background-only fit" = "flowchart-steps/bkg-only-fit.md" },
    { "2. Pseudo-data generation" = "flowchart-steps/pseudodata.md" },
    { "3. Spurious signal test" = "flowchart-steps/spurious-signal.md" },
    { "4. Signal injection test" = "flowchart-steps/signal-injection.md" },
    { "5. Background stability" = "flowchart-steps/background-stability.md" },
    { "6. Choosing the fit strategy" = "flowchart-steps/choose-strategy.md" },
    { "7. Inspecting the data" = "flowchart-steps/inspection.md" },
    { "8. S+B fits and limits" = "flowchart-steps/limits.md" },
  ] },
  { "Batch submission (HTCondor)" = "condor.md" },
  { "Reference" = "reference.md" },
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
