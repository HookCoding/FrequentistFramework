name: Tier 1 and Tier 2 quality gate

on:
  pull_request:
    branches:
      - harry
      - tier-2-m365
      - tier-3-m365
  push:
    branches:
      - harry
      - tier-2-m365
      - tier-3-m365

permissions:
  contents: read

jobs:
  lightweight-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev-lock.txt

      - name: Run complete lightweight quality gate
        run: |
          python scripts/quality_check.py --mode full
